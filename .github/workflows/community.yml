# Community bot: welcomes first-time contributors, thanks everyone whose pull request is merged,
# and assigns an issue to whoever comments "assign me", "/assign" or "I want to work on this".
# Shared logic: https://github.com/rohithprem18/.github/blob/main/.github/workflows/community.yml
name: Community bot

on:
  pull_request_target:
    types: [opened, closed]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  community:
    uses: rohithprem18/.github/.github/workflows/community.yml@main
