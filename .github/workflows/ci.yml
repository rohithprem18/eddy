name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Schema contract gate
        run: python -m eddy.compat_check
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Start the full pipeline
        run: docker compose up -d --build --wait kafka schema-registry redis feature-api
      - name: Bootstrap topics and schemas, then stream
        run: |
          docker compose up setup --exit-code-from setup
          docker compose up -d producer spark
      - name: Wait for features to land in Redis
        run: |
          for i in $(seq 1 40); do
            keys=$(docker compose exec -T redis redis-cli --scan --pattern 'eddy:user:*' --count 1000 | head -50 | wc -l)
            echo "attempt $i: $keys user keys"
            if [ "$keys" -gt 10 ]; then break; fi
            sleep 10
          done
          test "$keys" -gt 10
      - name: Query the feature API
        run: |
          user=$(docker compose exec -T redis redis-cli --scan --pattern 'eddy:user:*' | head -1 | cut -d: -f3)
          curl -sf "http://localhost:8000/features/$user" | tee /dev/stderr | grep -q '"found":true'
          curl -sf http://localhost:8000/stats
      - name: Wait for stateful window features
        run: |
          # u000000 is the heaviest user in the Zipf-skewed stream, so it appears in every window.
          for i in $(seq 1 30); do
            body=$(curl -s http://localhost:8000/features/u000000 || true)
            if echo "$body" | grep -q '"event_count_5m"' && echo "$body" | grep -q '"event_count_1h"'; then
              echo "$body"; exit 0
            fi
            echo "attempt $i: window features not yet present"
            sleep 10
          done
          exit 1
      - name: Throughput report
        run: curl -sf http://localhost:8000/stats
      - name: Console and contract endpoints
        run: |
          curl -sf http://localhost:8000/ | grep -q 'id="root"'
          curl -sf http://localhost:8000/contracts | tee /dev/stderr | grep -q '"available":true'
          curl -sf http://localhost:8000/dlq | tee /dev/stderr | grep -q '"available":true'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
